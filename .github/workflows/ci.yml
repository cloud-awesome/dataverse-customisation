name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src/CloudAwesome.Dataverse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CloudAwesome.Dataverse.sln

      - name: Build
        run: dotnet build CloudAwesome.Dataverse.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CloudAwesome.Dataverse.sln --configuration Release --no-build --logger trx --results-directory TestResults

